<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learnova 2.0 — Your One2One Tutor 24/7</title>

    <!-- ✅ SEO Metadata -->
    <meta
      name="description"
      content="Learnova 2.0 — AI-powered One2One tutoring with Shira & Shaima, adaptive learning paths, and personalized quizzes. Study smarter, anytime, anywhere."
    />
    <meta
      name="keywords"
      content="Learnova, AI Tutor, Shira, Shaima, Online Learning, One2One, Education Platform, Adaptive Learning"
    />
    <meta name="author" content="Learnova AI" />

    <!-- ✅ Social Sharing -->
    <meta property="og:title" content="Learnova 2.0 — Your AI One2One Tutor" />
    <meta
      property="og:description"
      content="Your personal AI tutors, Shira & Shaima, guiding every student to success through personalized learning."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <!-- ✅ Favicon & Branding -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- ✅ Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- ✅ Basic Styling (Optional Loader) -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
      }

      html, body {
        background: #f9fbff;
        color: #1d1d1f;
        min-height: 100%;
        overflow-x: hidden;
      }

      #root {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .loading-screen {
        text-align: center;
      }

      .loading-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
      }

      .loading-text {
        font-size: 1.1rem;
        color: #0071e3;
        font-weight: 500;
      }
    </style>
  </head>

  <body>
    <!-- App Root -->
    <div id="root">
      <div class="loading-screen">
        <img src="/favicon.png" alt="Learnova Logo" class="loading-logo" />
        <p class="loading-text">Loading Learnova 2.0 Tutor...</p>
      </div>
    </div>

    <!-- ✅ Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
